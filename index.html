<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Danique & Rens · 9 augustus 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --rose:       #c8737a;
      --rose-light: #f2dada;
      --rose-pale:  #fdf5f5;
      --sage:       #7a9e7e;
      --sage-light: #d8ead9;
      --sage-pale:  #f4f9f4;
      --gold:       #c9a96e;
      --gold-light: #f0e0c0;
      --gold-pale:  #fdf8ef;
      --ink:        #2d2420;
      --ink-soft:   #7a6258;
      --ink-faint:  #b8a89e;
      --surface:    #fffcf9;
      --border:     rgba(201,169,110,0.18);
      --shadow-sm:  0 2px 8px rgba(45,36,32,0.07);
      --shadow-md:  0 4px 20px rgba(45,36,32,0.10);
      --shadow-lg:  0 8px 40px rgba(45,36,32,0.13);
      --r-sm: 10px;
      --r-md: 16px;
      --r-lg: 22px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f7f0e8;
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* ─── HERO ─────────────────────────────────── */
    .hero {
      background: linear-gradient(160deg, #2d2420 0%, #4a3020 50%, #3d2818 100%);
      padding: 28px 20px 24px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: var(--shadow-lg);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .hero-names {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      color: #f5ede0;
      line-height: 1;
      letter-spacing: 0.01em;
    }
    .hero-names em {
      color: var(--gold);
      font-style: italic;
    }
    .hero-date {
      font-size: 0.72rem;
      color: rgba(245,237,224,0.6);
      margin-top: 5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .hero-clock-wrap { text-align: right; }
    #liveClock {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .hero-clock-label {
      font-size: 0.62rem;
      color: rgba(245,237,224,0.45);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 3px;
    }

    .hero-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 14px 0;
      opacity: 0.4;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-track {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--rose), var(--gold));
      border-radius: 4px;
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
    }
    .progress-text {
      font-size: 0.7rem;
      color: rgba(245,237,224,0.55);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    /* ─── TABS ─────────────────────────────────── */
    .tab-strip {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 14px 16px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tab-strip::-webkit-scrollbar { display: none; }

    .tab-pill {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 30px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--ink-soft);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.22s ease;
      white-space: nowrap;
    }
    .tab-pill.active {
      background: var(--ink);
      color: #f5ede0;
      border-color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .tab-pill .pill-count {
      background: rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 1px 7px;
      font-size: 0.65rem;
    }
    .tab-pill:not(.active) .pill-count {
      background: var(--gold-light);
      color: #7a5a20;
    }

    /* ─── CONTENT ──────────────────────────────── */
    .content-area { padding: 14px 14px 0; }

    /* ─── ITEM CARD ─────────────────────────────── */
    .item-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .item-card {
      background: var(--surface);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 1px solid var(--border);
    }
    .item-card:active { transform: scale(0.985); }

    .item-card.is-done {
      background: var(--sage-pale);
      border-color: var(--sage-light);
    }
    .item-card.is-late {
      background: #fff5f5;
      border-color: #f5c0c0;
    }
    .item-card.is-soon {
      background: #fffbf0;
      border-color: #f0dfa0;
    }
    .item-card.is-secret {
      background: #fbf5ff;
      border-color: #dfc0f5;
    }

    /* accent strip on left */
    .item-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      border-radius: 4px 0 0 4px;
      background: var(--gold);
    }
    .item-card.is-done::before { background: var(--sage); }
    .item-card.is-late::before { background: var(--rose); }
    .item-card.is-soon::before { background: #d4a017; }
    .item-card.is-secret::before { background: #9b59b6; }

    .item-main {
      display: flex;
      align-items: center;
      padding: 13px 13px 11px 16px;
      gap: 11px;
      cursor: pointer;
      user-select: none;
    }

    /* check circle */
    .check-circle {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
    }
    .check-circle::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--sage);
      transform: scale(0);
      transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    }
    .check-circle.checked { border-color: var(--sage); }
    .check-circle.checked::after { transform: scale(1); }
    .check-circle .check-icon {
      position: relative;
      z-index: 1;
      color: white;
      font-size: 0.85rem;
      opacity: 0;
      transform: scale(0) rotate(-10deg);
      transition: all 0.2s 0.05s cubic-bezier(.4,0,.2,1);
    }
    .check-circle.checked .check-icon {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
    .item-card.is-late .check-circle { border-color: var(--rose); }
    .item-card.is-soon .check-circle { border-color: #d4a017; }
    .item-card.is-secret .check-circle { border-color: #9b59b6; }

    .item-body { flex: 1; min-width: 0; }

    .item-time-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .item-time {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--gold);
    }
    .item-card.is-done .item-time { color: var(--sage); }
    .item-card.is-late .item-time { color: var(--rose); }
    .item-card.is-soon .item-time { color: #b8880a; }

    .badge-secret {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: #9b59b6;
      color: white;
      border-radius: 6px;
      padding: 1px 6px;
      text-transform: uppercase;
    }

    .item-what {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.35;
    }
    .item-card.is-done .item-what {
      text-decoration: line-through;
      color: var(--ink-faint);
    }
    .item-who {
      font-size: 0.72rem;
      color: var(--ink-soft);
      margin-top: 3px;
    }
    .item-loc {
      font-size: 0.68rem;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    /* countdown chip */
    .cd-chip {
      flex-shrink: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 52px;
    }
    .cd-number {
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .cd-unit {
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.75;
    }
    .cd-chip.state-future  { color: var(--ink-faint); }
    .cd-chip.state-soon    { color: #b8880a; }
    .cd-chip.state-late    { color: var(--rose); }
    .cd-chip.state-done    { color: var(--sage); }
    .cd-chip.state-none    { display: none; }

    /* expand / notes */
    .item-expand {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(.4,0,.2,1);
    }
    .item-expand.open { max-height: 200px; }

    .expand-inner {
      padding: 0 14px 12px 58px;
      border-top: 1px solid var(--border);
    }
    .notes-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-faint);
      margin-top: 10px;
      margin-bottom: 5px;
    }
    textarea.notes {
      width: 100%;
      padding: 9px 11px;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      color: var(--ink);
      background: var(--gold-pale);
      border: 1.5px solid var(--gold-light);
      border-radius: var(--r-sm);
      resize: none;
      min-height: 64px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    textarea.notes:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* ─── SECTION LABEL ─────────────────────────── */
    .section-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: var(--ink-soft);
      letter-spacing: 0.03em;
      margin: 4px 2px 12px;
    }

    /* ─── CONTACTS ──────────────────────────────── */
    .contact-list { display: flex; flex-direction: column; gap: 9px; }

    .contact-card {
      background: var(--surface);
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .c-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--rose));
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .c-body { flex: 1; min-width: 0; }
    .c-name { font-size: 0.9rem; font-weight: 700; color: var(--ink); }
    .c-role { font-size: 0.72rem; color: var(--rose); font-weight: 600; margin-top: 1px; }
    .c-note { font-size: 0.68rem; color: var(--ink-faint); margin-top: 2px; }

    /* ─── CORSAGES ──────────────────────────────── */
    .corsage-intro {
      background: var(--gold-pale);
      border: 1px solid var(--gold-light);
      border-radius: var(--r-md);
      padding: 12px 14px;
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .corsage-list { display: flex; flex-direction: column; gap: 9px; }
    .corsage-row {
      background: var(--surface);
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }
    .corsage-row.done { background: var(--sage-pale); border-color: var(--sage-light); }
    .cor-name { font-size: 0.9rem; font-weight: 700; }
    .cor-role { font-size: 0.72rem; color: var(--ink-soft); margin-top: 2px; }
    .cor-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.22s cubic-bezier(.4,0,.2,1);
      position: relative; overflow: hidden;
    }
    .cor-btn::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 50%;
      background: var(--sage);
      transform: scale(0);
      transition: transform 0.22s cubic-bezier(.4,0,.2,1);
    }
    .cor-btn.done { border-color: var(--sage); }
    .cor-btn.done::after { transform: scale(1); }
    .cor-btn-icon {
      position: relative; z-index: 1;
      color: white;
      opacity: 0;
      transform: scale(0);
      transition: all 0.18s 0.05s;
    }
    .cor-btn.done .cor-btn-icon { opacity: 1; transform: scale(1); }

    /* ─── OPEN PUNTEN ───────────────────────────── */
    .punt-card {
      background: var(--surface);
      border-radius: var(--r-md);
      border: 1px solid #f5d0a0;
      border-left: 4px solid #d4a017;
      box-shadow: var(--shadow-sm);
      padding: 12px 14px;
      margin-bottom: 9px;
      font-size: 0.83rem;
      color: var(--ink);
      line-height: 1.5;
    }
    .punt-icon { margin-right: 6px; }

    /* ─── BOTTOM NAV ────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,252,249,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 max(12px, env(safe-area-inset-bottom));
      z-index: 300;
      box-shadow: 0 -4px 20px rgba(45,36,32,0.08);
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-faint);
      font-size: 0.6rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 14px;
      transition: color 0.2s;
      position: relative;
    }
    .nav-btn.active { color: var(--ink); }
    .nav-btn .nav-icon {
      font-size: 1.45rem;
      line-height: 1;
      transition: transform 0.2s cubic-bezier(.4,0,.2,1);
    }
    .nav-btn.active .nav-icon { transform: scale(1.15); }
    .nav-dot {
      position: absolute;
      top: 2px; right: 10px;
      width: 7px; height: 7px;
      background: var(--rose);
      border-radius: 50%;
      border: 2px solid var(--surface);
      display: none;
    }
    .nav-dot.visible { display: block; }

    /* ─── VIEWS ─────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ─── CONFETTI ──────────────────────────────── */
    .confetti-piece {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9999;
      animation: fall 1.2s ease-out forwards;
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(160px) rotate(540deg) scale(0.5); opacity: 0; }
    }

    /* ─── NEXT UP BANNER ────────────────────────── */
    .next-banner {
      background: linear-gradient(90deg, var(--rose-pale), var(--gold-pale));
      border: 1px solid var(--gold-light);
      border-radius: var(--r-md);
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .next-banner-icon { font-size: 1.2rem; flex-shrink: 0; }
    .next-banner-body { flex: 1; min-width: 0; }
    .next-banner-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-faint);
    }
    .next-banner-what {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      margin-top: 1px;
    }
    .next-banner-time {
      font-size: 0.7rem;
      color: var(--rose);
      font-weight: 600;
    }
  </style>
</head>

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
function loadState() {
  try { return JSON.parse(localStorage.getItem('dr_state26') || '{}'); } catch { return {}; }
}
let S = loadState();
if (!S.done)      S.done = {};
if (!S.notes)     S.notes = {};
if (!S.corsages)  S.corsages = {};
if (!S.expanded)  S.expanded = {};
if (!S.phase)     S.phase = PHASES[0].id;

function save() { localStorage.setItem('dr_state26', JSON.stringify(S)); }

/* ═══════════════════════════════════════════════
   TIME HELPERS
═══════════════════════════════════════════════ */
function toDate(timeStr, dateStr) {
  if (!timeStr) return null;
  const [h,m] = timeStr.split(':').map(Number);
  const d = new Date(dateStr);
  d.setHours(h, m, 0, 0);
  return d;
}

function minsUntil(dt) {
  return Math.round((dt.getTime() - Date.now()) / 60000);
}

function fmtCountdown(mins) {
  const abs = Math.abs(mins);
  const h = Math.floor(abs / 60), m = abs % 60;
  const hm = h > 0 ? `${h}u${m > 0 ? m+'m' : ''}` : `${m}m`;
  return mins >= 0 ? [hm, 'nog'] : [hm, 'te laat'];
}

function chipState(mins, done) {
  if (done) return 'done';
  if (mins === null) return 'none';
  if (mins < 0) return 'late';
  if (mins <= 30) return 'soon';
  return 'future';
}

function cardState(mins, done, secret) {
  if (done)   return 'is-done';
  if (secret) return 'is-secret';
  if (mins !== null && mins < 0)  return 'is-late';
  if (mins !== null && mins <= 30) return 'is-soon';
  return '';
}

/* ═══════════════════════════════════════════════
   RENDER — PHASE TABS
═══════════════════════════════════════════════ */
function renderTabs() {
  const strip = document.getElementById('tabStrip');
  strip.innerHTML = PHASES.map(p => {
    const total = p.items.length;
    const done  = p.items.filter(i => S.done[i.id]).length;
    return `<button class="tab-pill ${p.id === S.phase ? 'active' : ''}"
      onclick="switchPhase('${p.id}')">
      ${p.emoji} ${p.label}
      <span class="pill-count">${done}/${total}</span>
    </button>`;
  }).join('');
}

/* ═══════════════════════════════════════════════
   RENDER — PHASE ITEMS
═══════════════════════════════════════════════ */
function renderPhase() {
  const phase = PHASES.find(p => p.id === S.phase);
  if (!phase) return;

  // find next unchecked timed item for banner
  const now = new Date();
  let nextItem = null, nextPhase = null;
  for (const ph of PHASES) {
    for (const it of ph.items) {
      if (S.done[it.id] || !it.time) continue;
      const dt = toDate(it.time, ph.date);
      if (dt > now) { nextItem = it; nextPhase = ph; break; }
    }
    if (nextItem) break;
  }

  let bannerHtml = '';
  if (nextItem) {
    const dt = toDate(nextItem.time, nextPhase.date);
    const mins = minsUntil(dt);
    const [val, unit] = fmtCountdown(mins);
    bannerHtml = `<div class="next-banner">
      <div class="next-banner-icon">⏭️</div>
      <div class="next-banner-body">
        <div class="next-banner-label">Volgende activiteit</div>
        <div class="next-banner-what">${nextItem.what}</div>
      </div>
      <div class="next-banner-time">${val} ${unit}</div>
    </div>`;
  }

  const cards = phase.items.map(item => {
    const done   = !!S.done[item.id];
    const dt     = item.time ? toDate(item.time, phase.date) : null;
    const mins   = dt ? minsUntil(dt) : null;
    const cs     = chipState(mins, done);
    const cls    = cardState(mins, done, item.secret);
    const isOpen = !!S.expanded[item.id];
    const notes  = S.notes[item.id] || '';
    const timeLbl = item.time
      ? (item.timeEnd ? `${item.time} – ${item.timeEnd}` : item.time)
      : '';

    let chipHtml = '';
    if (cs !== 'none') {
      if (cs === 'done') {
        chipHtml = `<div class="cd-chip state-done"><div class="cd-number">✓</div><div class="cd-unit">klaar</div></div>`;
      } else {
        const [val, unit] = fmtCountdown(mins);
        chipHtml = `<div class="cd-chip state-${cs}"><div class="cd-number">${val}</div><div class="cd-unit">${unit}</div></div>`;
      }
    }

    return `<div class="item-wrap">
      <div class="item-card ${cls}" id="card-${item.id}">
        <div class="item-main" onclick="toggleExpand('${item.id}')">
          <button class="check-circle ${done ? 'checked' : ''}"
            onclick="toggleDone(event,'${item.id}')">
            <span class="check-icon">✓</span>
          </button>
          <div class="item-body">
            ${timeLbl || item.secret ? `<div class="item-time-row">
              ${timeLbl ? `<span class="item-time">${timeLbl}</span>` : ''}
              ${item.secret ? `<span class="badge-secret">🎺 Verrassing</span>` : ''}
            </div>` : ''}
            <div class="item-what">${item.what}</div>
            <div class="item-who">${item.who}</div>
            <div class="item-loc">📍 ${item.loc}</div>
          </div>
          ${chipHtml}
        </div>
        <div class="item-expand ${isOpen ? 'open' : ''}" id="exp-${item.id}">
          <div class="expand-inner">
            <div class="notes-label">Notitie</div>
            <textarea class="notes" placeholder="Voeg een notitie toe…"
              oninput="saveNote('${item.id}',this.value)">${notes}</textarea>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('phaseContent').innerHTML =
    `<div class="section-label">${phase.emoji} ${phase.label}</div>${bannerHtml}${cards}`;
}

/* ═══════════════════════════════════════════════
   RENDER — CONTACTS
═══════════════════════════════════════════════ */

function renderCorsages() {

      <div>
        <div class="cor-name">${c.name}</div>
        <div class="cor-role">${c.role}</div>

      <button class="cor-btn ${done ? 'done' : ''}" onclick="toggleCorsage('${c.id}')">
        <span class="cor-btn-icon">✓</span>
      </button>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════
   RENDER — OPEN PUNTEN
═══════════════════════════════════════════════ */
function renderPunten() {
  document.getElementById('puntenList').innerHTML = OPEN_PUNTEN.map(p =>

/* ═══════════════════════════════════════════════
   PROGRESS
═══════════════════════════════════════════════ */
function updateProgress() {
  const total = PHASES.reduce((s,p) => s + p.items.length, 0);
  const done  = Object.values(S.done).filter(Boolean).length;
  const pct   = total > 0 ? (done / total * 100).toFixed(0) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total}`;
}

/* ═══════════════════════════════════════════════
   INTERACTIONS
═══════════════════════════════════════════════ */
function switchPhase(id) {
  S.phase = id;
  save();
  renderTabs();
  renderPhase();
}

function toggleDone(e, id) {
  e.stopPropagation();
  S.done[id] = !S.done[id];
  save();
  if (S.done[id]) spawnConfetti(e);
  renderTabs();
  renderPhase();
  updateProgress();
}

function toggleExpand(id) {
  S.expanded[id] = !S.expanded[id];
  save();
  const el = document.getElementById('exp-' + id);
  if (el) el.classList.toggle('open', !!S.expanded[id]);
}

function saveNote(id, text) {
  S.notes[id] = text;
  save();
}

function toggleCorsage(id) {
  S.corsages[id] = !S.corsages[id];
  save();
  const row = document.getElementById('cor-' + id);
  const btn = row.querySelector('.cor-btn');
  row.classList.toggle('done', !!S.corsages[id]);
  btn.classList.toggle('done', !!S.corsages[id]);
}

/* ═══════════════════════════════════════════════
   VIEWS
═══════════════════════════════════════════════ */
let activeView = 'draaiboek';
function showView(v) {
  activeView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + v).classList.add('active');
  if (v === 'contacten') renderContacts();
  if (v === 'corsages')  renderCorsages();
  if (v === 'punten')    renderPunten();
}

/* ═══════════════════════════════════════════════
   CONFETTI
═══════════════════════════════════════════════ */
const CONF_COLORS = ['#c8737a','#c9a96e','#7a9e7e','#d4b0e0','#f5c0a0'];
function spawnConfetti(e) {
  const x = e.clientX || window.innerWidth / 2;
  const y = e.clientY || window.innerHeight / 2;
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${x + (Math.random()-0.5)*60}px;
      top:${y}px;
      background:${CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)]};
      border-radius:${Math.random()>0.5?'50%':'3px'};
      width:${6+Math.random()*6}px;
      height:${6+Math.random()*6}px;
      animation-duration:${0.8+Math.random()*0.6}s;
      animation-delay:${Math.random()*0.15}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ═══════════════════════════════════════════════
   CLOCK & TICK
═══════════════════════════════════════════════ */
function tick() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('liveClock').textContent = h + ':' + m;
  if (activeView === 'draaiboek') renderPhase();
  updateProgress();
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
renderTabs();
renderPhase();
updateProgress();
tick();
setInterval(tick, 30000);
